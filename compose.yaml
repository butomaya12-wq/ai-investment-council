services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PG_VERSION: "18.6"
        PG_SHA256: "983ee554ec53dbeb9b70797bef9fcf4e67e117e7e48ca1463cc80b3ff8e8ff3f"
    image: aic-b1-postgresql:18.6-b1
    volumes:
      - aic_b1_pgdata:/var/lib/postgresql/data
    networks:
      - aic_b1_internal
    healthcheck:
      test: ["CMD", "/opt/postgresql/bin/pg_isready", "-d", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

volumes:
  aic_b1_pgdata:

networks:
  aic_b1_internal:
    internal: true
