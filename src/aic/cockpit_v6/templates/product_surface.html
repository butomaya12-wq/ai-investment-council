<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }} — Market Jury</title>

<style>
:root {
  --bg:#070a0d;
  --panel:#0d1217;
  --panel2:#10171d;
  --panel3:#090e12;
  --line:#1e2932;
  --line2:#2c3a45;
  --text:#f0f4f7;
  --soft:#b7c2ca;
  --muted:#71808d;

  --green:#61e3a6;
  --green-bg:rgba(97,227,166,.09);

  --red:#ff7471;
  --red-bg:rgba(255,116,113,.09);

  --amber:#efc463;
  --amber-bg:rgba(239,196,99,.09);

  --blue:#79afff;
  --blue-bg:rgba(121,175,255,.09);

  --violet:#bba7ff;
  --violet-bg:rgba(187,167,255,.09);

  --teal:#71d7c1;
  --teal-bg:rgba(113,215,193,.08);
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

a {
  color:inherit;
}

.topbar {
  height:68px;
  display:flex;
  align-items:center;
  gap:34px;
  padding:0 27px;
  border-bottom:1px solid var(--line);
  background:#080c10;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:195px;
}

.jury-mark {
  width:38px;
  height:38px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:8px;
  border:1px solid var(--line2);
  border-radius:10px;
  background:#0b1116;
}

.jury-dot {
  display:block;
  border-radius:50%;
}

.jury-bull { background:var(--green); }
.jury-bear { background:var(--red); }
.jury-red { background:var(--violet); }
.jury-judge { background:var(--amber); }

.brand strong,
.brand span {
  display:block;
}

.brand strong {
  font-size:11px;
  letter-spacing:.04em;
}

.brand span {
  margin-top:3px;
  color:var(--muted);
  font-size:6px;
  letter-spacing:.09em;
  text-transform:uppercase;
}

nav {
  display:flex;
  align-items:center;
  gap:23px;
}

nav a {
  color:#7f8d98;
  font-size:9px;
  text-decoration:none;
}

nav a:hover {
  color:#d0d7dc;
}

nav a.active {
  color:var(--text);
}

.header-status {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.status-badge {
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#0b1015;
  color:#8e9aa4;
  font-size:7px;
}

.status-badge.verified {
  color:var(--green);
  border-color:rgba(97,227,166,.22);
}

.page {
  width:min(1550px,100%);
  margin:0 auto;
  padding:32px 28px 46px;
}

.eyebrow {
  color:#7b8994;
  font-size:7px;
  font-weight:900;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.page-title {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:22px;
}

h1 {
  margin:8px 0 7px;
  font-size:37px;
  line-height:1;
  letter-spacing:-.035em;
}

.lead {
  max-width:760px;
  margin:0;
  color:#83919c;
  font-size:10px;
  line-height:1.6;
}

.snapshot-note {
  color:#687681;
  font-family:ui-monospace,monospace;
  font-size:7px;
  text-align:right;
}

.summary-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:24px;
}

.summary-card {
  min-height:125px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
}

.summary-card.green {
  border-color:rgba(97,227,166,.21);
  background:
    linear-gradient(
      135deg,
      rgba(97,227,166,.055),
      var(--panel) 55%
    );
}

.summary-card.red {
  border-color:rgba(255,116,113,.21);
  background:
    linear-gradient(
      135deg,
      rgba(255,116,113,.055),
      var(--panel) 55%
    );
}

.summary-card.amber {
  border-color:rgba(239,196,99,.23);
  background:
    linear-gradient(
      135deg,
      rgba(239,196,99,.055),
      var(--panel) 55%
    );
}

.summary-card.blue {
  border-color:rgba(121,175,255,.21);
}

.summary-label {
  color:#74828d;
  font-size:7px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.summary-value {
  margin-top:9px;
  font-size:24px;
  font-weight:850;
}

.summary-value.green { color:var(--green); }
.summary-value.red { color:var(--red); }
.summary-value.amber { color:var(--amber); }
.summary-value.blue { color:var(--blue); }

.summary-note {
  margin-top:7px;
  color:#71808b;
  font-size:8px;
  line-height:1.45;
}

.section {
  margin-top:13px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:17px;
}

.section h2 {
  margin:0;
  font-size:17px;
}

.section-copy {
  margin-top:5px;
  color:#74828d;
  font-size:8px;
}

.section-tag {
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:6px;
  color:#7f8d98;
  font-size:6px;
  font-weight:900;
  letter-spacing:.07em;
}

.account-empty {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:15px;
  align-items:center;
  padding:16px;
  border:1px dashed #34424c;
  border-radius:9px;
  background:#0a1014;
}

.empty-icon {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border:1px solid var(--line2);
  border-radius:50%;
  background:#111820;
  font-size:21px;
}

.account-empty strong {
  display:block;
  font-size:10px;
}

.account-empty span {
  display:block;
  margin-top:5px;
  color:#71808b;
  font-size:8px;
  line-height:1.45;
}

.read-state {
  color:var(--amber);
  font-size:7px;
  font-weight:900;
  text-align:right;
}

.idea-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.idea-card {
  display:block;
  padding:15px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel3);
  text-decoration:none;
  transition:.15s ease;
}

.idea-card:hover {
  transform:translateY(-2px);
  border-color:#40505c;
  background:#0d151b;
}

.idea-card.primary {
  border-color:rgba(239,196,99,.28);
  background:
    linear-gradient(
      145deg,
      rgba(239,196,99,.06),
      var(--panel3) 45%
    );
}

.idea-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.idea-symbol {
  font-size:17px;
  font-weight:900;
}

.idea-status {
  color:var(--amber);
  font-size:7px;
  font-weight:900;
}

.idea-company {
  margin-top:4px;
  color:#71808b;
  font-size:7px;
}

.idea-metrics {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.idea-metric {
  padding:8px;
  border:1px solid #19242c;
  border-radius:6px;
  background:#080d11;
}

.idea-metric span,
.idea-metric strong {
  display:block;
}

.idea-metric span {
  color:#687680;
  font-size:6px;
}

.idea-metric strong {
  margin-top:4px;
  font-size:11px;
}

.good { color:var(--green); }
.bad { color:var(--red); }
.warn { color:var(--amber); }

.opportunity-row {
  display:grid;
  grid-template-columns:85px 120px 1fr 62px;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid var(--line);
}

.opportunity-row:first-child {
  border-top:0;
}

.opportunity-label {
  color:#84919b;
  font-size:7px;
}

.opportunity-track {
  height:8px;
  border-radius:999px;
  overflow:hidden;
  background:#19242c;
}

.opportunity-fill {
  height:100%;
  border-radius:inherit;
}

.opportunity-fill.green {
  background:var(--green);
}

.opportunity-fill.blue {
  background:var(--blue);
}

.opportunity-value {
  font-family:ui-monospace,monospace;
  font-size:8px;
  font-weight:900;
  text-align:right;
}

/* Trades */

.pipeline {
  display:grid;
  grid-template-columns:1fr 36px 1fr 36px 1fr 36px 1fr 36px 1fr;
  align-items:stretch;
  gap:0;
}

.pipe-stage {
  min-height:150px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#090e12;
}

.pipe-stage.pass {
  border-color:rgba(97,227,166,.27);
  background:var(--green-bg);
}

.pipe-stage.watch {
  border-color:rgba(239,196,99,.33);
  background:var(--amber-bg);
}

.pipe-stage.blocked {
  border-color:rgba(255,116,113,.28);
  background:var(--red-bg);
}

.pipe-stage.waiting {
  opacity:.7;
}

.pipe-stage.broker {
  border-color:rgba(113,215,193,.30);
  background:var(--teal-bg);
}

.pipe-icon {
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border:1px solid var(--line2);
  border-radius:50%;
  background:#111820;
  font-size:16px;
}

.pipe-stage h3 {
  margin:12px 0 0;
  font-size:10px;
}

.pipe-status {
  margin-top:6px;
  font-size:12px;
  font-weight:900;
}

.pipe-stage.pass .pipe-status {
  color:var(--green);
}

.pipe-stage.watch .pipe-status {
  color:var(--amber);
}

.pipe-stage.blocked .pipe-status {
  color:var(--red);
}

.pipe-stage.broker .pipe-status {
  color:var(--teal);
}

.pipe-stage p {
  margin:7px 0 0;
  color:#71808b;
  font-size:7px;
  line-height:1.5;
}

.pipe-arrow {
  display:grid;
  place-items:center;
  color:#51606b;
  font-size:17px;
}

.trade-workspace {
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:12px;
}

.order-ticket {
  padding:18px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#090e12;
}

.ticket-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.ticket-symbol {
  font-size:26px;
  font-weight:900;
}

.ticket-lock {
  padding:6px 8px;
  border-radius:6px;
  background:var(--red-bg);
  color:var(--red);
  font-size:7px;
  font-weight:900;
}

.ticket-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:17px;
}

.ticket-field {
  padding:11px;
  border:1px solid #1b2730;
  border-radius:7px;
  background:#080d11;
}

.ticket-field span,
.ticket-field strong {
  display:block;
}

.ticket-field span {
  color:#687681;
  font-size:6px;
  text-transform:uppercase;
}

.ticket-field strong {
  margin-top:5px;
  font-size:10px;
}

.ticket-action {
  width:100%;
  margin-top:12px;
  padding:12px;
  border:1px solid rgba(255,116,113,.23);
  border-radius:7px;
  background:var(--red-bg);
  color:var(--red);
  font-size:8px;
  font-weight:900;
  text-align:center;
}

.blockers {
  padding:18px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#090e12;
}

.blockers h3 {
  margin:0;
  font-size:11px;
}

.blocker {
  margin-top:10px;
  padding:11px;
  border:1px solid rgba(255,116,113,.16);
  border-radius:7px;
  background:rgba(255,116,113,.035);
}

.blocker strong {
  display:block;
  color:#d8dfe4;
  font-size:8px;
}

.blocker span {
  display:block;
  margin-top:5px;
  color:#7e8b95;
  font-size:7px;
  line-height:1.45;
}

.activity-table {
  width:100%;
  border-collapse:collapse;
  font-size:8px;
}

.activity-table th,
.activity-table td {
  padding:11px 8px;
  border-top:1px solid var(--line);
  text-align:left;
}

.activity-table th {
  border-top:0;
  color:#6d7b86;
  font-size:6px;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.activity-table td {
  color:#aeb7be;
}

/* History */

.lifecycle-hero {
  display:grid;
  grid-template-columns:1fr 45px 1fr 45px 1fr 45px 1fr;
  align-items:center;
  gap:0;
}

.life-card {
  min-height:180px;
  padding:17px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#090e12;
}

.life-card.invest {
  border-color:rgba(97,227,166,.30);
  background:var(--green-bg);
}

.life-card.expired {
  border-color:rgba(255,116,113,.27);
  background:var(--red-bg);
}

.life-card.watch {
  border-color:rgba(239,196,99,.32);
  background:var(--amber-bg);
}

.life-card.capital {
  border-color:rgba(255,116,113,.27);
}

.life-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid var(--line2);
  border-radius:50%;
  background:#111820;
  font-size:18px;
}

.life-label {
  margin-top:12px;
  color:#75838e;
  font-size:6px;
  font-weight:900;
  letter-spacing:.07em;
}

.life-value {
  margin-top:5px;
  font-family:ui-monospace,monospace;
  font-size:18px;
  font-weight:900;
}

.invest .life-value { color:var(--green); }
.expired .life-value { color:var(--red); }
.watch .life-value { color:var(--amber); }
.capital .life-value { color:var(--red); }

.life-card p {
  margin:8px 0 0;
  color:#788691;
  font-size:7px;
  line-height:1.55;
}

.life-arrow {
  display:grid;
  place-items:center;
  color:#566571;
  font-size:20px;
}

.reason-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.reason-card {
  padding:14px;
  border:1px solid rgba(239,196,99,.17);
  border-radius:8px;
  background:rgba(239,196,99,.035);
}

.reason-card strong {
  display:block;
  font-size:9px;
}

.reason-card span {
  display:block;
  margin-top:6px;
  color:#788691;
  font-size:7px;
  line-height:1.5;
}

.result-strip {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.result-cell {
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#090e12;
}

.result-cell span,
.result-cell strong {
  display:block;
}

.result-cell span {
  color:#6e7c87;
  font-size:6px;
  text-transform:uppercase;
}

.result-cell strong {
  margin-top:6px;
  font-size:12px;
}

.footer-note {
  margin-top:14px;
  padding:11px 13px;
  border:1px solid rgba(239,196,99,.16);
  border-radius:8px;
  background:rgba(239,196,99,.03);
  color:#8f8161;
  font-size:7px;
  line-height:1.55;
}

@media(max-width:1000px) {
  .summary-grid,
  .idea-grid,
  .reason-grid,
  .result-strip {
    grid-template-columns:1fr;
  }

  .pipeline,
  .lifecycle-hero {
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }

  .pipe-arrow,
  .life-arrow {
    transform:rotate(90deg);
    min-height:24px;
  }

  .trade-workspace {
    grid-template-columns:1fr;
  }
}

@media(max-width:720px) {
  nav {
    display:none;
  }

  .page {
    padding-left:14px;
    padding-right:14px;
  }

  .page-title {
    display:block;
  }

  .snapshot-note {
    margin-top:12px;
    text-align:left;
  }

  .account-empty {
    grid-template-columns:1fr;
  }
}

/* V4.8 — semantic icon system */

.icon {
  width:22px;
  height:22px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-lg {
  width:26px;
  height:26px;
}

.icon-xl {
  width:30px;
  height:30px;
}

.icon-shell {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border:1px solid var(--line2);
  border-radius:50%;
  background:#111820;
  color:#b8c2c9;
}

.icon-shell.green {
  color:var(--green);
  border-color:rgba(97,227,166,.30);
  background:rgba(97,227,166,.07);
}

.icon-shell.red {
  color:var(--red);
  border-color:rgba(255,116,113,.30);
  background:rgba(255,116,113,.07);
}

.icon-shell.amber {
  color:var(--amber);
  border-color:rgba(239,196,99,.30);
  background:rgba(239,196,99,.07);
}

.icon-shell.blue {
  color:var(--blue);
  border-color:rgba(121,175,255,.30);
  background:rgba(121,175,255,.07);
}

.icon-shell.violet {
  color:var(--violet);
  border-color:rgba(187,167,255,.30);
  background:rgba(187,167,255,.07);
}

.icon-shell.teal {
  color:var(--teal);
  border-color:rgba(113,215,193,.30);
  background:rgba(113,215,193,.07);
}

.real-account-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:14px;
}

.real-account-card {
  min-height:112px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#090e12;
}

.real-account-card span,
.real-account-card strong,
.real-account-card small {
  display:block;
}

.real-account-card span {
  color:#6f7d88;
  font-size:6px;
  font-weight:900;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.real-account-card strong {
  margin-top:7px;
  font-size:20px;
}

.real-account-card small {
  margin-top:6px;
  color:#71808b;
  font-size:7px;
  line-height:1.45;
}

.snapshot-banner {
  display:flex;
  align-items:center;
  gap:13px;
  margin-top:14px;
  padding:13px 14px;
  border:1px solid rgba(121,175,255,.18);
  border-radius:8px;
  background:rgba(121,175,255,.035);
}

.snapshot-banner-copy strong,
.snapshot-banner-copy span {
  display:block;
}

.snapshot-banner-copy strong {
  font-size:9px;
}

.snapshot-banner-copy span {
  margin-top:4px;
  color:#71808b;
  font-size:7px;
}

.cash-state {
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
  margin-top:12px;
  padding:15px;
  border:1px solid rgba(97,227,166,.18);
  border-radius:8px;
  background:rgba(97,227,166,.035);
}

.cash-state strong,
.cash-state span {
  display:block;
}

.cash-state strong {
  font-size:10px;
}

.cash-state span {
  margin-top:4px;
  color:#71808b;
  font-size:7px;
  line-height:1.45;
}

.capital-distinction {
  display:grid;
  grid-template-columns:1fr 45px 1fr;
  align-items:center;
  gap:0;
  margin-top:13px;
}

.capital-state-card {
  min-height:145px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#090e12;
}

.capital-state-card.available {
  border-color:rgba(97,227,166,.25);
  background:rgba(97,227,166,.045);
}

.capital-state-card.locked {
  border-color:rgba(255,116,113,.25);
  background:rgba(255,116,113,.045);
}

.capital-state-card h3 {
  margin:12px 0 0;
  font-size:10px;
}

.capital-state-card strong {

<script>

const esc = (value) =>

let MJ_PRODUCT_SESSION = null;

function mjActiveSymbol() {
  return (
    MJ_PRODUCT_SESSION?.symbol
    || "NVDA"
  );
}

function mjRenderProductSessionBadge() {
  const nav =
    document.querySelector(".topbar nav");

  if (!nav) {
    return;
  }

  let pill =
    document.getElementById(
      "mjActiveSession"
    );

  if (!pill) {
    pill =
      document.createElement("span");

    pill.id = "mjActiveSession";
    pill.className = "mj-session-pill";

    nav.appendChild(pill);
  }

  pill.textContent =
    "ACTIVE SESSION · "
    + mjActiveSymbol();
}

async function mjProductSessionBootstrap() {
  try {
    const response =
      await fetch(
        "/api/product/session",
        {
          cache:"no-store",
        }
      );

    if (!response.ok) {
      throw new Error(
        "Product session fetch failed"
      );
    }

    MJ_PRODUCT_SESSION =
      await response.json();

  } catch (error) {
    console.error(
      "Market Jury product session:",
      error
    );

    MJ_PRODUCT_SESSION = {

      status:"FALLBACK",
    };
  }

  mjRenderProductSessionBadge();
}



function analytics(state, symbol) {
  return state.market.analytics?.[symbol] || null;
}

function metric(state, symbol, key) {
  const block = analytics(state, symbol);

  if (!block) {
    return null;
  }

  return block.metrics.find(
    (item) => item.key === key
  ) || null;
}

function metricDisplay(state, symbol, key) {
  return metric(state, symbol, key)?.display || "—";
}

function metricNumber(state, symbol, key) {
  const value = metric(state, symbol, key)?.value;

  return Number.isFinite(Number(value))
    ? Number(value)
    : 0;
}

function summaryCard(
  label,
  value,
  note,
  tone=""
) {
  return `
    <article class="summary-card ${tone}">
      <div class="summary-label">
        ${esc(label)}
      </div>

      <div class="summary-value ${tone}">
        ${esc(value)}
      </div>

      <div class="summary-note">
        ${esc(note)}
      </div>
    </article>
  `;
}

function companyName(symbol) {
  const names = {
    NVDA:"NVIDIA Corporation",
    MSFT:"Microsoft Corporation",
    META:"Meta Platforms",
  };

  return names[symbol] || symbol;
}

function money(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "—";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:2,
    }
  ).format(number);
}

async function boot() {
  const [
    stateResponse,
    brokerResponse,
  ] = await Promise.all([
    fetch(
      "/api/state",
      {cache:"no-store"}
    ),

    fetch(
      "/api/broker-snapshot",
      {cache:"no-store"}
    ),
  ]);

  if (!stateResponse.ok) {
    throw new Error(
      "Product state API failed"
    );
  }

  if (!brokerResponse.ok) {
    throw new Error(
      "Broker snapshot API failed"
    );
  }

  const state =
    await stateResponse.json();

  const broker =
    await brokerResponse.json();

  if (surface === "portfolio") {
    renderPortfolio(
      state,
      broker
    );

    return;
  }

  if (surface === "trades") {
    renderTrades(state);

    const account =
      broker.account || {};

    const buyingPower =
      account.buying_power
      ?? account.options_buying_power
      ?? null;

    const node =
      document.querySelector(
        "#tradeBuyingPower"
      );

    if (node) {
      node.textContent =
        money(buyingPower);
    }

    return;
  }

  renderHistory(state);
}

mjProductSessionBootstrap()
  .then(() => boot())
  .catch((error) => {
  $("#title").textContent =
    "Failed closed";

  $("#lead").textContent =
    error.message;
});
</script>

  ).format(n);
}

function mjLivePct(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return (
    (n >= 0 ? "+" : "")
    + n.toFixed(2)
    + "%"
  );
}

function mjLiveSymbol(symbol) {
  return (
    MJ_PRODUCT_LIVE
    .market
    ?.symbols
    ?.[symbol]
    || null
  );
}

function mjEnsurePageLiveStatus() {
  const pageTitle =
    document.querySelector(
      ".page-title > div:first-child"
    );

  if (!pageTitle) {
    return null;
  }

  let node =
    document.getElementById(
      "mjProductLive"
    );

  if (!node) {
    node =
      document.createElement(
        "div"
      );

    node.id = "mjProductLive";
    node.className =
      "mj-product-live";

    pageTitle.appendChild(node);
  }

  return node;
}

function mjUpdatePageStatus() {
  const node =
    mjEnsurePageLiveStatus();

  if (!node) {
    return;
  }

  const marketAge =
    MJ_PRODUCT_LIVE.marketLastMs
      ? (
          Date.now()
          - MJ_PRODUCT_LIVE.marketLastMs
        ) / 1000
      : null;

  const accountAge =
    MJ_PRODUCT_LIVE.accountLastMs
      ? (
          Date.now()
          - MJ_PRODUCT_LIVE.accountLastMs
        ) / 1000
      : null;

  const marketConnecting =
    marketAge === null;

  const marketStale =
    marketAge !== null
    && marketAge > 12;

  const marketState =
    marketConnecting
      ? "CONNECTING"
      : (
          marketStale
            ? "STALE READ-ONLY"
            : "LIVE READ-ONLY"
        );

  let accountState = "";

  if (
    surface === "portfolio"
    || surface === "trades"
  ) {
    accountState =
      accountAge === null
        ? " · account connecting / cached evidence shown"
        : ` · account ${accountAge.toFixed(0)}s ago`;
  }

  node.innerHTML = `
    <span class="mj-product-dot"></span>

    <strong>
      ${marketState}
    </strong>

    <span>
      Alpaca Paper + IEX
      ${
        marketAge === null
          ? "· market connecting"
          : `· market ${marketAge.toFixed(0)}s ago`
      }
      ${accountState}
    </span>
  `;

  const header =
    document.querySelector(
      ".status-badge.verified"
    );

  if (header) {
    header.textContent =
      `● ${marketState}`;
  }
}

function mjPortfolioMarket() {
  if (surface !== "portfolio") {
    return;
  }

  for (
    const symbol
    of ["NVDA", "MSFT", "META"]
  ) {
    const card =
      document.querySelector(
        `.idea-card[href*="symbol=${symbol}"]`
      );

    const live =
      mjLiveSymbol(symbol);

    if (
      !card
      || !live?.available
    ) {
      continue;
    }

    let node =
      card.querySelector(
        ".mj-live-idea"
      );

    if (!node) {
      node =
        document.createElement(
          "div"
        );

      node.className =
        "mj-live-idea";

      card.appendChild(node);
    }

    node.innerHTML = `
      <span>
        <span class="mj-product-dot"></span>
        LIVE
      </span>

      <strong>
        ${mjLiveMoney(
          live.latest_trade_price
        )}
        ·
        ${mjLivePct(
          live.day_change_pct
        )}
      </strong>
    `;
  }
}

function mjPortfolioAccount() {
  if (
    surface !== "portfolio"
    || !MJ_PRODUCT_LIVE.account
  ) {
    return;
  }

  const payload =
    MJ_PRODUCT_LIVE.account;

  const account =
    payload.account || {};

  const buyingPower =
    account.buying_power
    ?? account.options_buying_power;

  const summary =
    document.querySelector(
      "#summary"
    );

  if (summary) {
    summary.innerHTML =
      summaryCard(
        "LIVE PAPER EQUITY",
        mjLiveMoney(
          account.equity
        ),
        "Current Alpaca Paper account.",
        "green"
      )
      + summaryCard(
        "LIVE CASH",
        mjLiveMoney(
          account.cash
        ),
        "Current Alpaca Paper cash.",
        "blue"
      )
      + summaryCard(
        "OPEN POSITIONS",
        String(
          payload.position_count
        ),
        "Current paper-account positions.",
        payload.position_count === 0
          ? "green"
          : "amber"
      );
  }

  const cards =
    document.querySelectorAll(
      ".real-account-card strong"
    );

  const values = [
    account.equity,
    account.cash,
    buyingPower,
    payload.position_count,
  ];

  cards.forEach(
    (node, index) => {
      if (index >= values.length) {
        return;
      }

      node.textContent =
        index === 3
          ? String(values[index])
          : mjLiveMoney(values[index]);
    }
  );

  const capacity =
    document.querySelector(
      ".capital-state-card.available strong"
    );

  if (capacity) {
    capacity.textContent =
      mjLiveMoney(
        buyingPower
      );
  }

  const firstSection =
    document.querySelector(
      "#body .section"
    );

  if (firstSection) {
    const title =
      firstSection.querySelector(
        "h2"
      );

    if (title) {
      title.textContent =
        "Live broker account";
    }

    const tag =
      firstSection.querySelector(
        ".section-tag"
      );

    if (tag) {
      tag.textContent =
        "● LIVE PAPER";
    }
  }

  const existing =
    document.getElementById(
      "mjLivePositions"
    );

  if (existing) {
    existing.remove();
  }

  if (
    firstSection
    && payload.positions?.length
  ) {
    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.id =
      "mjLivePositions";

    wrapper.innerHTML = `
      <table class="mj-position-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Market value</th>
            <th>Unrealized P&amp;L</th>
          </tr>
        </thead>

        <tbody>
          ${payload.positions.map(
            (position) => `
              <tr>
                <td>
                  ${esc(position.symbol)}
                </td>

                <td>
                  ${esc(position.qty)}
                </td>

                <td>
                  ${mjLiveMoney(
                    position.current_price
                  )}
                </td>

                <td>
                  ${mjLiveMoney(
                    position.market_value
                  )}
                </td>

                <td>
                  ${mjLiveMoney(
                    position.unrealized_pl
                  )}
                </td>
              </tr>
            `
          ).join("")}
        </tbody>
      </table>
    `;

    firstSection.appendChild(
      wrapper
    );
  }
}

function mjTradesMarket() {
  if (surface !== "trades") {
    return;
  }

  const live =
    mjLiveSymbol(mjActiveSymbol());

  if (!live?.available) {
    return;
  }

  const ticket =
    document.querySelector(
      ".order-ticket"
    );

  if (!ticket) {
    return;
  }

  let node =
    ticket.querySelector(
      ".mj-trade-live-price"
    );

  if (!node) {
    node =
      document.createElement(
        "div"
      );

    node.className =
      "mj-trade-live-price";

    const head =
      ticket.querySelector(
        ".ticket-head"
      );

    if (head) {
      head.insertAdjacentElement(
        "afterend",
        node
      );
    }
  }

  node.innerHTML = `
    <strong>
      ${mjLiveMoney(
        live.latest_trade_price
      )}
    </strong>

    <span>
      ${mjLivePct(
        live.day_change_pct
      )} today ·
      bid ${mjLiveMoney(live.bid_price)} ·
      ask ${mjLiveMoney(live.ask_price)}
    </span>
  `;
}

function mjTradesAccount() {
  if (
    surface !== "trades"
    || !MJ_PRODUCT_LIVE.account
  ) {
    return;
  }

  const account =
    MJ_PRODUCT_LIVE
    .account
    .account || {};

  const buyingPower =
    account.buying_power
    ?? account.options_buying_power;

  const node =
    document.getElementById(
      "tradeBuyingPower"
    );

  if (node) {
    node.textContent =
      mjLiveMoney(
        buyingPower
      );
  }
}

function mjHistoryMarket() {
  if (surface !== "history") {
    return;
  }

  const live =
    mjLiveSymbol(mjActiveSymbol());

  if (!live?.available) {
    return;
  }

  let node =
    document.getElementById(
      "mjHistoryMarket"
    );

  if (!node) {
    node =
      document.createElement(
        "div"
      );

    node.id =
      "mjHistoryMarket";

    node.className =
      "mj-live-market-context";

    const pageTitle =
      document.querySelector(
        ".page-title"
      );

    if (pageTitle) {
      pageTitle.insertAdjacentElement(
        "afterend",
        node
      );
    }
  }

  node.innerHTML = `
    <div class="mj-product-dot"></div>

    <div>
      <strong>
        Current ${esc(
          mjActiveSymbol()
        )} market telemetry
      </strong>

      <span>
        Active-session telemetry only.
        Canonical decision history is displayed separately below.
      </span>
    </div>

    <div class="mj-live-market-value">
      ${mjLiveMoney(
        live.latest_trade_price
      )}
      ·
      ${mjLivePct(
        live.day_change_pct
      )}
    </div>
  `;
}

function mjApplyLiveProduct() {
  mjUpdatePageStatus();
  mjPortfolioMarket();
  mjPortfolioAccount();
  mjTradesMarket();
  mjTradesAccount();
  mjHistoryMarket();
}

async function mjProductPollMarket() {
  if (
    document.visibilityState
    !== "visible"
  ) {
    return;
  }

  try {
    const response =
      await fetch(
        "/api/live/market",
        {
          cache:"no-store",
        }
      );

    if (!response.ok) {
      throw new Error(
        "market unavailable"
      );
    }

    MJ_PRODUCT_LIVE.market =
      await response.json();

    MJ_PRODUCT_LIVE.marketLastMs =
      Date.now();

    mjApplyLiveProduct();

  } catch (error) {
    console.warn(
      "Product live market read failed",
      error
    );
  }
}

async function mjProductPollAccount() {
  if (
    document.visibilityState
    !== "visible"
  ) {
    return;
  }

  if (
    surface !== "portfolio"
    && surface !== "trades"
  ) {
    return;
  }

  try {
    const response =
      await fetch(
        "/api/live/account",
        {
          cache:"no-store",
        }
      );

    if (!response.ok) {
      throw new Error(
        "account unavailable"
      );
    }

    MJ_PRODUCT_LIVE.account =
      await response.json();

    MJ_PRODUCT_LIVE.accountLastMs =
      Date.now();

    mjApplyLiveProduct();

  } catch (error) {
    console.warn(
      "Product live account read failed",
      error
    );
  }
}

setTimeout(
  () => {
    mjProductPollMarket();
    mjProductPollAccount();
  },
  450
);

setInterval(
  mjProductPollMarket,
  3000
);

setInterval(
  mjProductPollAccount,
  30000
);

setInterval(
  mjUpdatePageStatus,
  1000
);
</script>

</body>
</html>
