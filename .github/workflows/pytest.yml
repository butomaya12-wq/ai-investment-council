name: pytest

on:
  push:
    branches:
      - hackathon/alpaca-2026
  pull_request:
    branches:
      - hackathon/alpaca-2026

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Resolve pinned official JSON Schema corpora
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/json-schema-test-suite
          git clone --quiet https://github.com/json-schema-org/JSON-Schema-Test-Suite.git /tmp/json-schema-test-suite
          mkdir -p "$GITHUB_WORKSPACE/.ci-corpora"

          resolve_corpus() {
            local relative_path="$1"
            local expected_sha="$2"
            local output_path="$3"
            local found=""
            cd /tmp/json-schema-test-suite
            while read -r commit; do
              if git show "$commit:$relative_path" > "$output_path.candidate" 2>/dev/null; then
                actual_sha="$(sha256sum "$output_path.candidate" | awk '{print $1}')"
                if [[ "$actual_sha" == "$expected_sha" ]]; then
                  mv "$output_path.candidate" "$output_path"
                  found="$commit"
                  echo "Resolved $relative_path at $commit ($actual_sha)"
                  break
                fi
              fi
            done < <(git log --format=%H -- "$relative_path")
            rm -f "$output_path.candidate"
            if [[ -z "$found" ]]; then
              echo "Pinned corpus not found for $relative_path / $expected_sha" >&2
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          }

          resolve_corpus \
            "tests/draft2020-12/optional/format/date-time.json" \
            "e351b8ca0e97f7ee415fabea7a2b1f3dbf68eb369acf59dfce515b947d08820a" \
            "$GITHUB_WORKSPACE/.ci-corpora/date-time.json"

          resolve_corpus \
            "tests/draft2020-12/optional/format/uuid.json" \
            "25951c7ab5f48991ca3e752513bf38febcbdca066540a844e5bba7ec9a88eaa6" \
            "$GITHUB_WORKSPACE/.ci-corpora/uuid.json"

          echo "AIC_OFFICIAL_DATETIME_CORPUS=$GITHUB_WORKSPACE/.ci-corpora/date-time.json" >> "$GITHUB_ENV"
          echo "AIC_OFFICIAL_UUID_CORPUS=$GITHUB_WORKSPACE/.ci-corpora/uuid.json" >> "$GITHUB_ENV"

      - name: Run exact repository tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
