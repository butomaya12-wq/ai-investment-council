name: pytest

on:
  push:
    branches:
      - hackathon/alpaca-2026
  pull_request:
    branches:
      - hackathon/alpaca-2026

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run exact repository tests
        run: uv run pytest -q
